<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Wedding Anniversary Akka & Bava ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at center, #790b30, #390016 65%, #160008);
    font-family: Georgia, serif;
    color: #ffe3a0;
}

.screen {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
}

.frame {
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(255, 218, 145, 0.6);
    border-radius: 14px;
    pointer-events: none;
}

.content {
    width: 100%;
    max-width: 700px;
    text-align: center;
    z-index: 2;
    animation: reveal 2s ease both;
}

.top-heart {
    font-size: clamp(38px, 7vw, 65px);
    color: #ff789e;
    text-shadow: 0 0 15px #ff285e, 0 0 40px #ff285e;
    animation: heartbeat 1.5s infinite;
    margin-bottom: 18px;
}

.small-text {
    font-family: Arial, sans-serif;
    font-size: clamp(10px, 2vw, 13px);
    letter-spacing: 4px;
    line-height: 1.8;
    color: #ffe3a0;
    margin-bottom: 18px;
}

h1 {
    font-weight: normal;
    font-size: clamp(34px, 8vw, 76px);
    line-height: 1.15;
    letter-spacing: 2px;
    color: #fff0cf;
    text-shadow: 0 0 18px rgba(255, 215, 130, 0.7);
}

.script {
    display: block;
    font-style: italic;
    font-size: clamp(42px, 9vw, 85px);
    line-height: 1.35;
    color: #ffdc91;
}

.divider {
    width: min(260px, 75%);
    height: 1px;
    margin: 24px auto;
    background: linear-gradient(90deg, transparent, #ffdc91, transparent);
    position: relative;
}

.divider::after {
    content: "♥";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 0 12px;
    background: #650021;
    color: #ff91b5;
    font-size: 20px;
}

.names {
    font-size: clamp(30px, 7vw, 58px);
    line-height: 1.4;
    font-weight: normal;
    color: #fff0d5;
}

.names span {
    color: #ff91b5;
    text-shadow: 0 0 18px rgba(255, 70, 130, 0.8);
}

.bottom-hearts {
    margin-top: 22px;
    font-size: 27px;
    letter-spacing: 7px;
    animation: glitter 2s ease-in-out infinite alternate;
}

.floating {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.heart {
    position: absolute;
    bottom: -40px;
    color: #ff668f;
    text-shadow: 0 0 12px #ff315e;
    animation: floatUp linear forwards;
}

.sparkle {
    position: absolute;
    color: #ffe7a8;
    text-shadow: 0 0 10px #ffd56e;
    animation: glitter 2s ease-in-out infinite alternate;
}

@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.13); }
    30% { transform: scale(1); }
    45% { transform: scale(1.08); }
}

@keyframes glitter {
    from { opacity: .4; }
    to {
        opacity: 1;
        text-shadow: 0 0 18px #ffdc91;
    }
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }
    15% { opacity: .8; }
    100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

@media (max-width: 400px) {
    .screen { padding: 18px; }
    .frame { inset: 8px; }
    .small-text { letter-spacing: 2px; }
    h1 { letter-spacing: 1px; }
    .divider { margin: 18px auto; }
    .bottom-hearts { letter-spacing: 4px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
body {
    background-image: url("anniversary-bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
/* Full-screen anniversary background */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background-image: url("Anniversary-bg.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* Keep decorative animations above the background */
canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}
</style>

</head>

<body>
    <audio id="backgroundMusic" autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
  Your browser does not support audio playback.
</audio>

<main class="screen">

    <div class="frame"></div>

    <div class="floating" id="floating"></div>


</main>

<script>
const floating = document.getElementById("floating");

function createHeart() {
    const heart = document.createElement("span");
    heart.className = "heart";

    heart.textContent = Math.random() > 0.5 ? "♥" : "♡";
    heart.style.left = Math.random() * 100 + "%";
    heart.style.fontSize = (13 + Math.random() * 20) + "px";
    heart.style.animationDuration = (8 + Math.random() * 6) + "s";

    floating.appendChild(heart);

    setTimeout(() => heart.remove(), 15000);
}

function createSparkles() {
    for (let i = 0; i < 30; i++) {
        const star = document.createElement("span");
        star.className = "sparkle";
        star.textContent = Math.random() > 0.5 ? "✦" : "✧";
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";
        star.style.fontSize = (8 + Math.random() * 12) + "px";
        star.style.animationDelay = Math.random() * 3 + "s";
        floating.appendChild(star);
    }
}

for (let i = 0; i < 10; i++) {
    setTimeout(createHeart, i * 400);
}

setInterval(createHeart, 1200);
createSparkles();
</script>
<script>
const music = document.getElementById("backgroundMusic");
const savedTime = Number(localStorage.getItem("musicTime") || 0);

music.addEventListener("loadedmetadata", () => {
  if (savedTime < music.duration) music.currentTime = savedTime;
  music.play().catch(() => {
    // Autoplay with sound may require the visitor to press Play.
  });
});

music.addEventListener("timeupdate", () => {
  localStorage.setItem("musicTime", music.currentTime);
});

window.addEventListener("beforeunload", () => {
  localStorage.setItem("musicTime", music.currentTime);
});
</script>
</body>
</html>
